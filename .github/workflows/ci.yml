name: CI - Validaciones de cadena de frío

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    name: Validar proyecto y ejecutar pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17 (requerido por Spark 3.5)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validar sintaxis Python
        run: python -m compileall -q .

      - name: Ejecutar pruebas automatizadas
        run: python -m pytest -v

      - name: Validar Docker Compose
        run: docker compose config -q

      - name: Validar sintaxis de los DAGs de Airflow
        run: |
          python -m py_compile airflow/dags/cadena_frio_calidad_dag.py airflow/dags/cadena_frio_logica.py